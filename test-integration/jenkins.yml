- description: Command update-view should display forbidden error message when trying to update a view without authorization
  command: 'JENKINS_URL={jenkins_secured_url} {nestor} update-view someview {examples}/config_view.xml'
  exitcode: 1
  output: 'Forbidden'

- description: Stop Jenkins and remove containers
  command: 'make -f {fixtures}/Makefile stop-jenkins'
  exitcode: 0
